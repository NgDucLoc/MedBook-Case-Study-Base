name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medbook
          POSTGRES_PASSWORD: medbook
          POSTGRES_DB: medbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medbook -d medbook_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4300
      DATABASE_URL: postgres://medbook:medbook@localhost:5432/medbook_test
      DEMO_AUTH_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Test
        run: npm test
